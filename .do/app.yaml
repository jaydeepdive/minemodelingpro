# MineModelingPro on DigitalOcean App Platform.
#
# This file is the reference copy of the live app spec; the app is managed through
# the API (see studio/DEPLOY-DO.md). Secrets are NOT here — they are set as
# encrypted app-level environment variables.
#
#   doctl apps spec get <app-id> > .do/app.yaml      # pull the live spec
#   doctl apps update <app-id> --spec .do/app.yaml   # push a change
name: minemodelingpro
region: tor

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/jaydeepdive/minemodelingpro.git
      branch: main
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
      # 3, not 15, and not 60. There is ONE instance, so a deployment replaces
      # it: until the new container passes a health check there is nothing for
      # the edge to route to, and the whole site answers 503 for the length of
      # this delay. 60 s was right when startup waited up to a minute for
      # Postgres to attach; since the app starts degraded and serves the
      # gallery without a database, it is ready in about two seconds.
      #
      # 15 was still a FLOOR of fifteen seconds of 503 on every deployment,
      # whatever the app did — the probe is not even attempted before then.
      # Measured over 14 days, 50 commits touched the paths that redeploy this
      # app, so that floor was being paid three or four times a day in
      # unpredictable fifteen-second windows, which is exactly what a person
      # reloading the site runs into.
      #
      # Dropping it is safe in the other direction: a slow start costs a failed
      # probe, not a failed deployment — see failure_threshold below.
      initial_delay_seconds: 3
      # AND THE GAP BETWEEN PROBES IS THE REST OF THE OUTAGE.
      #
      # Lowering the floor to 3 s was only half of it. The probe then ran every
      # TWENTY seconds, so a first probe landing a moment before the container
      # accepts connections costs the whole next interval: the window is 3 s, or
      # 23 s, or 43 s, in twenty-second steps. Measured on the 2026-11-19
      # deployment, the site answered 504 for at least 32 s — the second probe,
      # not the first.
      #
      # The app imports in 0.58 s and serves degraded without a database, so it
      # does not need a leisurely probe; it needs a prompt one. Two seconds with
      # ten failures allowed keeps the same ~20 s of grace for a genuinely slow
      # start while detecting a ready container within ~2 s of it being ready.
      period_seconds: 2
      failure_threshold: 10
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

workers:
  - name: modeler
    dockerfile_path: Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/jaydeepdive/minemodelingpro.git
      branch: main
    run_command: python studio/worker.py
    # 2 GB, not 1: a client's multi-element drill database is ~900,000 assay rows
    # and the build peaked at 1.07 GB with every element carried and every metal
    # reported (measured 2026-10-20, 602 holes, 19 elements). At 1 GB the kernel
    # kills the worker mid-build, which the app can only show as a job that never
    # finishes. Changing this file does not change the running app — the live
    # spec lives in the DO console (Apps > minemodelingpro > modeler > Settings >
    # Resource Size) or goes up via PUT /v2/apps/{id}/spec with DO_DEPLOY_TOKEN.
    instance_size_slug: apps-s-1vcpu-2gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false

domains:
  - domain: minemodelingpro.com
    type: PRIMARY
    zone: minemodelingpro.com
  - domain: www.minemodelingpro.com
    type: ALIAS
    zone: minemodelingpro.com
  - domain: minemodelingpro.ca
    type: ALIAS
    zone: minemodelingpro.ca

# App-level envs (set via the API/UI, SECRET where marked):
#   MMP_ENV=production
#   MMP_SECRET          SECRET  session signing key
#   SPACES_BUCKET=mmp-studio
#   SPACES_REGION=tor1
#   SPACES_KEY          SECRET
#   SPACES_SECRET       SECRET
#   MMP_ADMIN_EMAIL             bootstrap admin (first start only)
#   MMP_ADMIN_PASSWORD  SECRET  change it after the first sign-in
