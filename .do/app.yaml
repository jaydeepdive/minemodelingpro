# MineModelingPro on DigitalOcean App Platform.
#
# This file is the reference copy of the live app spec; the app is managed through
# the API (see studio/DEPLOY-DO.md). Secrets are NOT here — they are set as
# encrypted app-level environment variables.
#
#   doctl apps spec get <app-id> > .do/app.yaml      # pull the live spec
#   doctl apps update <app-id> --spec .do/app.yaml   # push a change
name: minemodelingpro
region: tor

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/jaydeepdive/minemodelingpro.git
      branch: main
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /api/health
      initial_delay_seconds: 60
      period_seconds: 20
      failure_threshold: 5
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

workers:
  - name: modeler
    dockerfile_path: Dockerfile
    source_dir: /
    git:
      repo_clone_url: https://github.com/jaydeepdive/minemodelingpro.git
      branch: main
    run_command: python studio/worker.py
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: false

domains:
  - domain: minemodelingpro.com
    type: PRIMARY
    zone: minemodelingpro.com
  - domain: www.minemodelingpro.com
    type: ALIAS
    zone: minemodelingpro.com
  - domain: minemodelingpro.ca
    type: ALIAS
    zone: minemodelingpro.ca

# App-level envs (set via the API/UI, SECRET where marked):
#   MMP_ENV=production
#   MMP_SECRET          SECRET  session signing key
#   SPACES_BUCKET=mmp-studio
#   SPACES_REGION=tor1
#   SPACES_KEY          SECRET
#   SPACES_SECRET       SECRET
#   MMP_ADMIN_EMAIL             bootstrap admin (first start only)
#   MMP_ADMIN_PASSWORD  SECRET  change it after the first sign-in
