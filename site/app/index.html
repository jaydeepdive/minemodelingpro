<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · MineModelingPro Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<style>
  body{background:#f5f7fa}
  .signwrap{min-height:100vh;display:grid;place-items:center;padding:28px 20px}
  .signcard{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;
            padding:30px 28px 26px;box-shadow:0 14px 40px rgba(17,20,24,.08)}
  .signcard .brand{display:flex;flex-direction:column;gap:3px;text-decoration:none;margin-bottom:22px}
  .signcard .brand .name{font-family:'Bitter',serif;font-weight:800;font-size:21px;color:var(--ink)}
  .signcard .brand .name b{color:var(--red)}
  .signcard .brand .sub{font-family:'Bitter',serif;font-weight:700;font-size:10px;letter-spacing:2.4px;
                        color:var(--mut);text-transform:uppercase}
  .signcard h1{font-size:21px;margin-bottom:4px}
  .signcard .hint{font-size:13.5px;color:var(--mut);margin:0 0 18px}
  .signcard label{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px}
  .signcard input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;
                  font-size:15px;font-family:inherit;background:#fff}
  .signcard input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.10)}
  .signcard .field{margin-bottom:14px}
  .signcard button{width:100%;height:46px;border:0;border-radius:9px;background:var(--red);color:#fff;
                   font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
  .signcard button:hover{background:#b3141a}
  .signcard button:disabled{opacity:.6;cursor:default}
  .alt{margin-top:16px;font-size:13px;color:var(--mut);text-align:center}
  .back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--mut)}
  .back:hover{color:var(--red)}
</style>
</head>
<body>
<div class="signwrap">
  <div class="signcard">
    <a class="brand" href="../index.html">
      <span class="name">Mine<b>Modeling</b>Pro</span>
      <span class="sub">Studio</span>
    </a>
    <h1 id="authtitle">Sign in</h1>
    <p class="hint" id="authnote">Studio is for invited clients. Your drill data and models stay private to your account.</p>
    <div id="msg"></div>
    <form id="authform">
      <div class="field" id="namewrap" style="display:none"><label>Name</label><input type="text" name="name" autocomplete="name"></div>
      <div class="field" id="invitewrap" style="display:none"><label>Invite code</label><input type="text" name="invite" autocomplete="off" placeholder="the code you were sent"></div>
      <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="8" autocomplete="current-password"></div>
      <button id="submit" type="submit">Sign in</button>
    </form>
    <p class="alt"><a href="#" id="toggle">I have an invite code</a></p>
    <a class="back" href="../index.html">← About MineModelingPro</a>
  </div>
</div>
<script type="module">
import { $, banner, session, signIn, signUp } from "./app.js";
if (await session()) location.href = "dashboard.html";
let mode = "signin";
const q = new URLSearchParams(location.search);
const next = q.get("next") || "dashboard.html";
$("#toggle").onclick = e => {
  e.preventDefault();
  mode = mode === "signin" ? "signup" : "signin";
  $("#authtitle").textContent = mode === "signin" ? "Sign in" : "Create your account";
  $("#submit").textContent = mode === "signin" ? "Sign in" : "Create account";
  $("#namewrap").style.display = $("#invitewrap").style.display = mode === "signup" ? "block" : "none";
  $("#toggle").textContent = mode === "signin" ? "I have an invite code" : "I already have an account";
  $("#authnote").textContent = mode === "signin"
    ? "Studio is for invited clients. Your drill data and models stay private to your account."
    : "Enter the invite code you were sent and choose a password.";
  if (mode === "signup" && q.get("invite")) $("[name=invite]").value = q.get("invite");
  banner("");
};
if (q.get("invite")) $("#toggle").click();
$("#authform").onsubmit = async e => {
  e.preventDefault(); banner(""); $("#submit").disabled = true;
  const f = new FormData(e.target), email = f.get("email").trim(), password = f.get("password");
  try {
    if (mode === "signup") await signUp({ email, password, name: f.get("name") || "", invite: (f.get("invite") || "").trim() });
    else await signIn(email, password);
    location.href = next;
  } catch (err) { banner(err.message || String(err)); }
  finally { $("#submit").disabled = false; }
};
</script>
</body>
</html>
