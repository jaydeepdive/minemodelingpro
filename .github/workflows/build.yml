name: mmp-daily-build

# Builds the standalone MineModelingPro site: syncs the drill-news bank (from the
# MiningNewsTerminal API when configured, else a no-op), rebuilds the working store
# from committed shards, exports, renders the 3D model gallery + viewers, then
# commits site/ and deploys to GitHub Pages.
on:
  schedule:
    - cron: "40 5 * * *"      # daily 05:40 UTC (after the weekly backbone/report jobs)
  workflow_dispatch:

concurrency:
  group: mmp-build
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (ghostscript for Camelot)
        run: sudo apt-get update -q && sudo apt-get install -y -q ghostscript
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Sync ALL Closeology-collected data (drill bank, prices, facts, ...)
        run: PYTHONPATH=src python -m minemodelingpro.closeology_sync || true
      - name: Sync drill-news bank (MiningNewsTerminal API, if configured)
        env:
          MNT_API_URL: ${{ secrets.MNT_API_URL }}
          MNT_API_KEY: ${{ secrets.MNT_API_KEY }}
        run: PYTHONPATH=src python -m minemodelingpro.drill_sync || true
      - name: Rebuild working store from committed shards + export
        run: |
          PYTHONPATH=src python -m minemodelingpro.shards rebuild || true
          PYTHONPATH=src python -m minemodelingpro.export || true
      - name: DEM tile cache (terrain)
        uses: actions/cache@v4
        with:
          path: data/cache/dem
          key: dem-${{ github.run_id }}
          restore-keys: dem-
      - name: Render 3D model gallery + viewers
        run: PYTHONPATH=src python -c "from minemodelingpro import model3d; model3d.build_all('site')"
      - name: Root index = gallery
        run: cp site/models.html site/index.html
      - name: Commit site + shard store
        run: |
          git config user.name "mmp-bot"
          git config user.email "actions@github.com"
          git pull --no-edit -X ours origin main || true
          git add -A site data/keep/mmp data/keep/mmp_collars_sample.csv 2>/dev/null || true
          git commit -m "MMP daily build $(date -u +%Y-%m-%d) [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
