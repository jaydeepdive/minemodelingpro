name: deploy-pages-fast

# Deploys the already-committed site/ to GitHub Pages in ~1 min for ordinary
# pushes (manual page edits). The daily build owns full rebuilds and deploys its
# own [skip ci] commit, so this does not double-fire on those.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages-fast
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
