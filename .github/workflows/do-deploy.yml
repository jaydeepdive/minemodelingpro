# Deploy the current main to DigitalOcean App Platform.
#
# Cloud-only: GitHub Actions calls the DO API directly. Nothing runs on a local
# machine. Runs after the daily gallery build and on any push that changes the app,
# and can be run by hand from the Actions tab.
#
# Needs one repository secret: DO_DEPLOY_TOKEN (a DigitalOcean API token with app
# read/write). If the secret is absent the job exits quietly, so forks and PRs are
# unaffected. DO_APP_ID below is not a secret.
#
# If the repo is connected to DigitalOcean through its GitHub integration, this
# workflow is unnecessary — DO deploys on push by itself.
#
# THIS IS THE PRIMARY DEPLOYER. The app also watches main itself
# (studio/autodeploy.py), which is the fallback for the case this job cannot
# cover — a push that never reaches Actions — and which now waits out a grace
# period so it does not race this job. The race is not theoretical: DO cancels
# an in-progress deployment when a newer one is created for the same app, so
# whichever of the two asked second silently killed the other's deployment and
# the loser emailed Jordan a failure for an app that deployed fine. That is what
# happened to ab370d8 on 2026-10-27. Hence the two rules below: a deployment
# superseded by another is not this job's failure, and a build that errors once
# is retried before anyone is told.
name: mmp-do-deploy

# WHAT IS NOT HERE, and why: `site/**` and the daily build.
#
# Every deployment of this app is an outage. There is one web instance, so the
# new container has to pass a health check before anything serves again, and
# redeploying for content that does not need a restart buys a 503 window for
# nothing. The gallery does not need one: `studio/sitesync.py` mirrors `site/`
# from the GitHub tarball to Spaces in the WORKER (`mirror()`, every 600 s) and
# the WEB pulls it (`pull()`, every 180 s) and serves it in place of the baked
# copy whenever it is fresher. A nightly gallery build therefore reaches the
# live site within about thirteen minutes, with no deployment at all.
#
# `mmp-daily-build` commits only `site/` and the shards under `data/keep/`, so
# a `workflow_run` trigger on it was one guaranteed outage a day to publish
# content that was already arriving on its own.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "studio/**"
      - "src/**"
      - ".do/**"
  workflow_dispatch:

concurrency:
  group: do-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # `.do/app.yaml` is a REFERENCE COPY — the live spec is in the DO console,
      # and the two have drifted (the file asks 2 GB for the modeler; the live
      # one runs 1 GB). So this does NOT apply the file: applying it wholesale
      # would silently resize components and change the bill.
      #
      # It reconciles the web service's HEALTH CHECK and nothing else, because
      # those fields are the length of every deployment's outage and there is no
      # other way to reach them from here. Reads the LIVE spec, changes them if
      # they differ from the file, puts it back. Idempotent: it acts once and
      # then never again. Never blocks a deployment.
      #
      # It was one field (initial_delay_seconds) and that was not enough: the
      # floor is only the first probe, and period_seconds is the gap before the
      # second one. Tuning the floor while leaving a 20 s period left the real
      # window untouched, and the file said 3 s while the site was down for 32.
      # Anything in health_check that this does not copy is a comment.
      - name: Keep the health check in step with .do/app.yaml
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.DO_DEPLOY_TOKEN }}
          APP_ID: d8920ba3-ecb3-47a8-a9a0-b5ead409277e
        run: |
          [ -z "$TOKEN" ] && { echo "no token — skipping"; exit 0; }
          python3 - <<'EOF'
          import json, os, re, urllib.request

          FIELDS = ("initial_delay_seconds", "period_seconds",
                    "failure_threshold", "success_threshold", "timeout_seconds")
          want = {}
          try:
              inblock = False
              for line in open(".do/app.yaml"):
                  if re.match(r"\s*health_check:\s*$", line):
                      inblock = True
                      continue
                  if inblock:
                      m = re.match(r"\s+(\w+):\s*(\S+)", line)
                      if not m:                     # dedented out of the block
                          if line.strip() and not line.lstrip().startswith("#"):
                              inblock = False
                          continue
                      k, v = m.group(1), m.group(2)
                      if k in FIELDS and v.isdigit():
                          want[k] = int(v)
                      elif k not in FIELDS and k != "http_path":
                          inblock = False
          except OSError as e:
              print("cannot read .do/app.yaml (%s) — nothing to do" % e); raise SystemExit
          if not want:
              print("no health-check numbers in .do/app.yaml — nothing to do"); raise SystemExit
          api = "https://api.digitalocean.com/v2/apps/" + os.environ["APP_ID"]
          hdr = {"Authorization": "Bearer " + os.environ["TOKEN"],
                 "Content-Type": "application/json"}
          app = json.load(urllib.request.urlopen(
              urllib.request.Request(api, headers=hdr), timeout=30))["app"]
          spec = app["spec"]
          web = [s for s in spec.get("services") or [] if s.get("name") == "web"]
          if not web:
              print("no web service in the live spec"); raise SystemExit
          hc = web[0].setdefault("health_check", {})
          diff = {k: v for k, v in want.items() if hc.get(k) != v}
          if not diff:
              print("live health check already matches .do/app.yaml: %s"
                    % {k: hc.get(k) for k in want}); raise SystemExit
          before = {k: hc.get(k) for k in diff}
          hc.update(diff)
          req = urllib.request.Request(api, method="PUT", headers=hdr,
                                       data=json.dumps({"spec": spec}).encode())
          urllib.request.urlopen(req, timeout=60).read()
          print("health check %s -> %s (this is the length of every "
                "deployment's outage)" % (before, diff))
          EOF

      - name: Trigger a deployment
        env:
          TOKEN: ${{ secrets.DO_DEPLOY_TOKEN }}
          APP_ID: d8920ba3-ecb3-47a8-a9a0-b5ead409277e
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DO_DEPLOY_TOKEN is not set — skipping (DigitalOcean may be deploying on push instead)."
            exit 0
          fi
          API="https://api.digitalocean.com/v2/apps/$APP_ID"
          AUTH="Authorization: Bearer $TOKEN"
          phase=$(curl -fsS -H "$AUTH" "$API" | python3 -c \
            "import sys,json;a=json.load(sys.stdin)['app'];d=a.get('in_progress_deployment');print(d['phase'] if d else 'IDLE')")
          if [ "$phase" != "IDLE" ]; then
            echo "A deployment is already $phase — leaving it alone."; exit 0
          fi
          # Did something else deploy this very commit while we were asking?
          live() {
            curl -fsS -H "$AUTH" "$API" | python3 -c \
              "import sys,json; a=json.load(sys.stdin)['app']; d=a.get('active_deployment') or {}; \
               c=[x for p in ('services','workers','static_sites','jobs') for x in (d.get(p) or [])]; \
               print('BUSY' if a.get('in_progress_deployment') else 'IDLE', \
                     ([x.get('source_commit_hash') for x in c if x.get('source_commit_hash')] or [''])[-1])"
          }
          attempt() {
            id=$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                 "$API/deployments" -d '{"force_build":true}' | python3 -c \
                 "import sys,json;print(json.load(sys.stdin)['deployment']['id'])")
            echo "Deployment $id started."
            for i in $(seq 1 60); do
              sleep 20
              p=$(curl -fsS -H "$AUTH" "$API/deployments/$id" | python3 -c \
                  "import sys,json;print(json.load(sys.stdin)['deployment']['phase'])")
              echo "  $p"
              case "$p" in
                ACTIVE) echo "Deployed."; return 0 ;;
                ERROR) echo "Deployment ERROR"; return 2 ;;
                CANCELED) echo "Deployment CANCELED"; return 3 ;;
              esac
            done
            echo "Still deploying after 20 minutes — check the DO console."; return 1
          }

          # `attempt; rc=$?` would never run the assignment: Actions runs this
          # with `-e`, so a function returning non-zero ends the step there. In
          # an if-condition the status is being TESTED, so -e stands aside.
          if attempt; then rc=0; else rc=$?; fi
          if [ "$rc" = 3 ]; then
            # DO cancels a deployment when a newer one supersedes it. If the app
            # is deploying again, or is already serving this commit, the app got
            # where it needed to go and this job has nothing to report.
            set -- $(live)
            if [ "$1" = "BUSY" ]; then
              echo "Superseded by a newer deployment, which is still running — not a failure here."
              exit 0
            fi
            if [ "$2" = "$GITHUB_SHA" ]; then
              echo "Superseded, and the app is already serving $GITHUB_SHA — not a failure here."
              exit 0
            fi
            echo "Cancelled, and the app is on ${2:-an unknown commit} rather than $GITHUB_SHA."
            exit 1
          fi
          if [ "$rc" = 2 ]; then
            # A build that fails once is usually a registry or network hiccup, and
            # a retry costs four minutes against emailing a failure for an app
            # that is fine. A build that fails twice is a real one.
            echo "Retrying once before calling it a failure."
            if attempt; then
              exit 0
            fi
            echo "Failed twice — this is a real build failure."
            exit 1
          fi
          exit $rc
